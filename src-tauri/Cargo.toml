[package]
name = "undust"
version = "0.1.0"
description = "A little less clutter."
authors = ["Gokulakrishnan"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.85"

[lib]
name = "undust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
trash = "5"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary"] }
base64 = "0.22"
